<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e4dc"/>
      <stop offset="1" stop-color="#d6cfc4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f1"/>
      <stop offset="1" stop-color="#f4efe4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b59a7c"/>
      <stop offset="1" stop-color="#8f765d"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#fff8e8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff8e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <g filter="url(#soft)">
    <!-- window wall -->
    <rect x="120" y="110" width="860" height="660" rx="6" fill="url(#sky)"/>
    <g fill="#bcc9d2" opacity="0.7">
      <rect x="170" y="470" width="120" height="300"/>
      <rect x="310" y="400" width="90" height="370"/>
      <rect x="420" y="520" width="150" height="250"/>
      <rect x="600" y="440" width="110" height="330"/>
      <rect x="740" y="500" width="190" height="270"/>
    </g>
    <g fill="#8b8378">
      <rect x="110" y="100" width="880" height="16"/>
      <rect x="110" y="764" width="880" height="16"/>
      <rect x="110" y="100" width="16" height="680"/>
      <rect x="974" y="100" width="16" height="680"/>
      <rect x="542" y="100" width="12" height="680"/>
      <rect x="110" y="430" width="880" height="10"/>
    </g>
    <!-- floor -->
    <rect x="0" y="830" width="1920" height="250" fill="url(#floor)"/>
    <rect x="0" y="826" width="1920" height="10" fill="#cbbfae"/>
    <!-- shelf -->
    <rect x="1240" y="240" width="520" height="16" rx="3" fill="#a4886b"/>
    <rect x="1240" y="430" width="520" height="16" rx="3" fill="#a4886b"/>
    <g>
      <rect x="1270" y="160" width="34" height="80" rx="3" fill="#5f7a6b"/>
      <rect x="1310" y="175" width="28" height="65" rx="3" fill="#d1a15e"/>
      <rect x="1344" y="150" width="38" height="90" rx="3" fill="#7d6a99"/>
      <rect x="1390" y="185" width="26" height="55" rx="3" fill="#c9714f"/>
      <circle cx="1560" cy="205" r="34" fill="#e4dacb"/>
      <rect x="1640" y="170" width="80" height="70" rx="8" fill="#47596b"/>
      <rect x="1290" y="360" width="140" height="70" rx="10" fill="#efe7da"/>
      <rect x="1480" y="340" width="36" height="90" rx="3" fill="#3f6c8f"/>
      <rect x="1522" y="355" width="30" height="75" rx="3" fill="#e0b25d"/>
      <rect x="1558" y="345" width="34" height="85" rx="3" fill="#9a5b4c"/>
    </g>
    <!-- plant -->
    <path d="M1080 830 l20 -150 h120 l20 150 z" fill="#c9b8a1"/>
    <g fill="#4f7a55">
      <ellipse cx="1130" cy="590" rx="40" ry="110" transform="rotate(-25 1130 590)"/>
      <ellipse cx="1200" cy="560" rx="38" ry="130" transform="rotate(18 1200 560)"/>
      <ellipse cx="1160" cy="520" rx="34" ry="140"/>
      <ellipse cx="1240" cy="620" rx="30" ry="90" transform="rotate(48 1240 620)"/>
      <ellipse cx="1085" cy="640" rx="28" ry="80" transform="rotate(-55 1085 640)"/>
    </g>
    <!-- desk + lamp -->
    <rect x="1340" y="640" width="560" height="22" rx="4" fill="#6e5948"/>
    <rect x="1370" y="662" width="18" height="170" fill="#5c4a3c"/>
    <rect x="1850" y="662" width="18" height="170" fill="#5c4a3c"/>
    <path d="M1700 640 v-170 l60 -40" stroke="#2f2f33" stroke-width="10" fill="none"/>
    <path d="M1735 420 l70 -10 l10 50 z" fill="#2f2f33"/>
    <rect x="1440" y="560" width="170" height="80" rx="6" fill="#d9d4cc"/>
  </g>
  <ellipse cx="1785" cy="470" rx="140" ry="90" fill="#fff4d6" opacity="0.55" filter="url(#softer)"/>
  <rect width="1920" height="1080" fill="url(#light)"/>
</svg>
