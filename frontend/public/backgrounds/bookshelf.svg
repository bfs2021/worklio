    </g>
    <g id="row2">
      <rect x="0" y="-150" width="38" height="150" rx="4" fill="#3d6b8c"/>
      <rect x="44" y="-185" width="50" height="185" rx="4" fill="#d79a52"/>
      <rect x="100" y="-165" width="34" height="165" rx="4" fill="#7b3f4f"/>
      <rect x="140" y="-140" width="44" height="140" rx="4" fill="#cfc4b0"/>
      <circle cx="250" cy="-60" r="58" fill="#4e7d55"/>
      <rect x="215" y="-40" width="70" height="40" rx="8" fill="#c7b199"/>
      <rect x="320" y="-175" width="40" height="175" rx="4" fill="#5a4c7e"/>
      <rect x="366" y="-155" width="36" height="155" rx="4" fill="#b8653f"/>
      <rect x="408" y="-190" width="48" height="190" rx="4" fill="#2b4a3d"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#wood)"/>
