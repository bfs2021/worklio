services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  s3:
    # S3-compatible object storage for local dev (stand-in for AWS S3).
    image: chrislusf/seaweedfs:latest
    # Credentials must match S3_ACCESS_KEY / S3_SECRET_KEY in .env (dev only).
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  api:
    build: ./backend
    # Dev: run as root so generated migrations and caches can be written to the mounted source.
    user: "0"
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    user: "0"
    env_file: .env
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes: [./backend:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    # Periodic task scheduler (e.g. hourly orphaned-upload cleanup).
    build: ./backend
    user: "0"
    env_file: .env
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes: [./backend:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  livekit:
    # Huddles (audio/video/screen share). --dev uses the built-in key pair devkey / secret.
    image: livekit/livekit-server:v1.9
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

volumes:
  pgdata:
  s3data:
