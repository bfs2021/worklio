name: Bug report
description: Something in Worklio doesn't work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        **Security problems must not be reported here.** See SECURITY.md and use private vulnerability reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, including how many accounts were involved (for realtime or call bugs).
      placeholder: |
        1. Sign in as user A at http://localhost:3000
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Messaging
        - Navigation / productivity
        - Calls and huddles
        - Canvas / whiteboard / boards
        - Worklio AI
        - Admin / permissions
        - Appearance / accessibility
        - Setup / Docker / configuration
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser and version, how you run Worklio (docker compose, outside Docker, custom deployment).
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Browser console errors, `make logs` output, screenshots. Remove tokens, keys and personal data first.
      render: text
